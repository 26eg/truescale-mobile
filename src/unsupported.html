<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueScale Mobile</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #1d1d1f;
        font-size: 13px;
        line-height: 1.55;
      }
      .card {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        background: #f5f5f7;
        padding: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }
      .desc {
        margin: 0;
        font-size: 12px;
        color: #3a3a3c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1c1e;
          color: #f5f5f7;
        }
        .card {
          background: #2c2c2e;
          border-color: rgba(255, 255, 255, 0.12);
        }
        .desc {
          color: #e5e5ea;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <img class="icon" src="./icons/icon32-gray.png" alt="TrueScale Mobile" />
        <h1 id="title" class="title"></h1>
      </div>
      <p id="desc" class="desc"></p>
    </div>
    <script type="module" src="./unsupported/main.ts"></script>
  </body>
</html>
