name: Release Extension (ZIP & CRX)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests, typecheck & production build
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Package clean ZIP for Chrome Web Store
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p release-assets
          (cd dist && zip -r "../release-assets/truescale-mobile-${TAG}.zip" . -x "*.DS_Store")

      - name: Package signed CRX (if CRX_PRIVATE_KEY secret is configured)
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [ -z "$CRX_KEY" ]; then
            echo "CRX_PRIVATE_KEY secret is not set; skipping .crx generation (ZIP is ready for store upload)."
            exit 0
          fi
          if echo "$CRX_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$CRX_KEY" > "$RUNNER_TEMP/extension.pem"
          else
            printf '%s' "$CRX_KEY" | base64 --decode > "$RUNNER_TEMP/extension.pem"
          fi
          chmod 600 "$RUNNER_TEMP/extension.pem"
          npx --yes crx3 dist -p "$RUNNER_TEMP/extension.pem" -o "release-assets/truescale-mobile-${TAG}.crx"

      - name: Clean up temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/extension.pem"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "TrueScale Mobile ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.crx
